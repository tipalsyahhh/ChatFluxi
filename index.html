<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="1.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>ChatFluxi</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="tipal">
    <div class="container">
        <div class="load" id="loader">
            <div class="judul">
                <center>
                    <div class="spinner"></div>
                </center>
            </div>
        </div>
        <div class="foouter">
            <div class="isi">
                <div class="text">
                    <p>NovDetect</p>
                    <h4>Cermati Benur, Selamatkan Panen</h4>
                </div>
                <div class="navbar">
                    <button class="button-navbar" id="toggleSidebar"><i class="bi bi-layout-wtf"></i></button>
                </div>
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-content">
                        <div class="button-sidebar">
                            <div class="button-close">
                                <button class="close-sidebar" id="closeSidebar"><i class="bi bi-arrow-right-circle"></i></button>
                            </div>
                            <div class="button-user">
                                <button class="new"><i class="bi bi-search"></i></button>
                                <button class="new"><i class="bi bi-pencil-square"></i></button>
                            </div>
                        </div>
                        <h3>History</h3>
                        <div class="isi-histori">
                            <a href="#">Cek kesehatan Benur saya</a>
                            <a href="#">Cek kesehatan Benur saya</a>
                            <a href="#">Cek kesehatan Benur saya</a>
                        </div>
                        <div class="profile">
                            <div class="user">
                                <img src="1.jpg" alt="image" class="profile-user">
                                <p>Tifal Syah</p>
                            </div>
                            <div class="logout">
                                <button class="button-logout"><i class="bi bi-arrow-bar-right"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-container">
            <div class="wadah">
                <div class="chat-box" id="chat-box">
                </div>
            </div>
        </div>
        <div id="file-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <a href="#" id="file-upload-link" class="upload-link" style="margin-bottom: 5px;"><i class="bi bi-images" style="margin-right: 3px;"></i><p style="margin: 0;">Upload Image</p></a>
                <a href="#" class="setting"><i class="bi bi-gear-fill" style="margin-right: 3px;"></i><p style="margin: 0;">Setting</p></a>
            </div>
        </div>
        <div class="chat-input-container">
            <div class="input-user">
                <button class="files" id="open-modal"><i class="bi bi-link-45deg"></i></button>
                <input type="text" id="user-input" class="chat-input" placeholder="Message ChatFluxi...">
                <button id="record-button" class="record-btn">
                    <i class="bi bi-mic" style="font-size: 20px;"></i>
                </button>
            </div>
            <button class="send-btn" onclick="sendMessage(document.getElementById('user-input').value)">
                <i class="bi bi-send-plus" style="font-size: 20px;"></i>
            </button>
        </div>
    </div>
    <script src="scrip.js"></script>
    <script src="api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.js"></script>
    <script src="vanta.net.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            VANTA.NET({
                el: "#tipal",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color:  0x10AFED,
                backgroundColor: 0xffffff,
                maxDistance: 21.00
            });
        });
    </script>

</body>

</html>
